<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra - Clothes X</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">Clothes X</div>
        <button class="menu-toggle" id="btn-menu" aria-label="Abrir Menu">☰</button>
        <nav id="menu-navegacao">
            <ul>
                <li><a href="index.html#inicio">Início</a></li>
                <li><a href="index.html#produtos">Temporadas</a></li>
                <li><a href="index.html#produtos">Masculino</a></li>
                <li><a href="index.html#produtos">Feminino</a></li>
                <li><a href="index.html#produtos">Bermudas</a></li>
                <li><a href="index.html#produtos">Calçados</a></li>
                <li><a href="index.html#produtos">Saias</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="deveres">
            <div id="informações">
                <form id="for">
                    <label for="name">Nome:</label>
                    <input type="text" id="name" required placeholder="ex: jonas">
                    <br>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required>
                    <br>
                    <label for="tel">Telefone:</label>
                    <input type="tel" id="tel" required>
                    <br>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" required maxlength="14"
                        title="Digite o CPF no formato 000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}\-\d{2}">
                    <br>
                    <label for="est">Estado:</label>
                    <input type="text" id="est" required>
                    <br>
                    <label for="rua">Rua:</label>
                    <input type="text" id="rua" required>
                    <br>
                    <label for="nc">n° da casa:</label>
                    <input type="number" id="nc" required>
                    <br>
                    <label>Apartamento?</label>
                    <input type="radio" name="apart" id="apart-sim" value="verdadeiro">
                    sim
                    <input type="radio" name="apart" id="apart-nao" value="falso">
                    nao
                    <br>
                </form>
            </div>
        </section>
        <section class="direitos">
            <div id="produto"></div>
        </section>
        <button type="submit" id="verif" form="for">Finalizar Compra</button>
    </main>

    <script>
      const divProduto = document.getElementById('produto');
      const formCompra = document.getElementById('for');
      const carrinho = JSON.parse(localStorage.getItem('clothesx_carrinho')) || [];

      function formatarReal(valor) {
        return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      }

      if (divProduto) {
        if (carrinho.length === 0) {
          divProduto.innerHTML = '<p>Nenhum item no carrinho.</p>';
        } else {
          let total = 0;
          const itensHtml = carrinho.map(item => {
            const subtotal = item.preco * item.quantidade;
            total += subtotal;
            const extras = [];
            if (item.cor && item.cor !== 'Padrão') extras.push(`Cor: ${item.cor}`);
            if (item.tamanho) extras.push(`Tam: ${item.tamanho}`);
            const extrasLabel = extras.length ? ` — ${extras.join(' · ')}` : '';
            const imgTag = item.imagem
              ? `<img src="${item.imagem}" alt="${item.nome}" style="width:48px;height:48px;object-fit:cover;border-radius:4px;vertical-align:middle;margin-right:8px;">`
              : '';
            return `<p style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">${imgTag}${item.quantidade}x ${item.nome}${extrasLabel} — <strong>${formatarReal(subtotal)}</strong></p>`;
          }).join('');

          divProduto.innerHTML = `
            <h3>Resumo do Pedido</h3>
            ${itensHtml}
            <hr>
            <p><strong>Total: ${formatarReal(total)}</strong></p>
          `;
        }
      }

      if (formCompra) {
        formCompra.addEventListener('submit', (e) => {
          e.preventDefault();
          if (carrinho.length === 0) {
            alert('Seu carrinho está vazio!');
            return;
          }
          alert('Compra finalizada com sucesso! Obrigado por comprar na Clothes X.');
          localStorage.removeItem('clothesx_carrinho');
          window.location.href = 'index.html';
        });
      }
    </script>
</body>

</html>
